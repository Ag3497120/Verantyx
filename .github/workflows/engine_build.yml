name: engine (macOS + Windows)

# The engine is plain Python, so it already runs on both. What does not
# cross a platform boundary is the FROZEN binary, and that is the thing a
# person without a Python install actually needs. Build it where it has to
# run: macOS here, Windows here, and say plainly that Windows is unverified
# until this job has gone green at least once.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/engine_build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: vera-memory-macos
            bin: dist/vera-memory
          - os: windows-latest
            name: vera-memory-windows
            bin: dist/vera-memory.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e . || pip install -r requirements.txt || true

      - name: Prove the guarantees before shipping anything
        run: python -m verantyx.cli doctor

      - name: Re-run every measurement
        run: python experiments/guard/verify_all.py

      # 中身が古いまま「Build complete」と出る罠を実測済みなので、
      # dist を消してから --clean で凍結する(この2つは省略しない)。
      - name: Freeze
        shell: bash
        run: |
          rm -f dist/vera-memory dist/vera-memory.exe
          python -m PyInstaller --noconfirm --clean vera-memory.spec

      - name: Check the frozen binary answers
        shell: bash
        run: |
          BIN="${{ matrix.bin }}"
          "$BIN" doctor
          "$BIN" index build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: engine/${{ matrix.bin }}
          if-no-files-found: error
