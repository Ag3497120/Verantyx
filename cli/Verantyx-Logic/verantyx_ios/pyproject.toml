[tool.briefcase]
project_name = "Verantyx"
bundle = "com.kofdai"
version = "1.0.0"
url = "https://huggingface.co/kofdai/verantyx-logic-math"
license = "MIT"
author = "Kofdai"
author_email = "info@example.com"

[tool.briefcase.app.verantyx]
formal_name = "Verantyx Logic"
description = "Symbolic Logic Reasoner for iOS"
long_description = "A deterministic logic inference engine based on Kripke semantics."
icon = "src/verantyx/resources/icons/verantyx"
sources = [
    "src/verantyx"
]
requires = [
    "toga-iOS",
    "pydantic",
    "typing_extensions",
    "std-nslog"
]

[tool.briefcase.app.verantyx.macOS]
requires = [
    "toga-cocoa",
    "std-nslog",
]

[tool.briefcase.app.verantyx.linux]
requires = [
    "toga-gtk",
]

[tool.briefcase.app.verantyx.windows]
requires = [
    "toga-winforms",
]

# Mobile settings
[tool.briefcase.app.verantyx.iOS]
requires = [
    "toga-iOS",
    "std-nslog"
]
info_plist = { "NSCameraUsageDescription" = "Verantyx uses the camera to capture formulas and logical statements for direct symbolic reasoning and verification.", "NSPhotoLibraryUsageDescription" = "Verantyx needs access to your photo library to let you select existing images of mathematical formulas for OCR analysis." }
