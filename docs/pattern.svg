<text x="126.5" y="26.00" font-size="3" fill="#666">1466.3cm²</text>
<text x="30.0" y="164.50" font-size="3" fill="#b04">solid = sewing line / dashed = cut line / blue = notch</text>
<text x="30.0" y="169.00" font-size="3" fill="#b04">(single front, double back) / green = grain. Scale 1:1</text>
<text x="30.0" y="173.50" font-size="3" fill="#b04">(cm)</text>
<text x="30.0" y="178.00" font-size="3" fill="#666">This is the tool's own simplified block, not Bunka, Doreme or any</text>
<text x="30.0" y="182.50" font-size="3" fill="#666">other published drafting system. Every formula is printed, so if</text>
<text x="30.0" y="187.00" font-size="3" fill="#666">you disagree with it, look at the formulas. The pattern is derived</text>
<text x="30.0" y="191.50" font-size="3" fill="#666">from measurements. Nobody has looked at a real pattern for this</text>
<text x="30.0" y="196.00" font-size="3" fill="#666">garment.</text>
<text x="30.0" y="205.00" font-size="3" fill="#666">Layer numbers are an internal naming convention. ASTM D6673-10</text>
<text x="30.0" y="209.50" font-size="3" fill="#666">was withdrawn in January 2019 with no replacement, so no</text>
<text x="30.0" y="214.00" font-size="3" fill="#666">conformance to it is claimed. Notches are drawn at their real</text>
<text x="30.0" y="218.50" font-size="3" fill="#666">2.5 mm. Print at 1:1 and you will see them.</text>
</svg>